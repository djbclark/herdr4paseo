[project]
name = "herdr4paseo"
version = "0.1.0"
description = "A log view plus prompt box for one Paseo agent, built on the paseo CLI (runs fine inside a Herdr pane)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "websockets>=13"]

[project.scripts]
herdr4paseo = "herdr4paseo.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr4paseo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
